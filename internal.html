  <button id="go" style="margin-top:0.9rem; font-family:Archivo,sans-serif; font-size:0.9375rem; font-weight:500; padding:0.55rem 1.4rem; background:var(--ink); color:var(--paper); border:0; border-radius:2px; cursor:pointer;">Unlock</button>
  <p id="err" style="color:var(--fire); display:none; font-size:0.9rem;">That passphrase didn&rsquo;t work.</p>
</div>
<div id="content"></div>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock() {
  const pw = document.getElementById("pw").value;
  try {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(P.salt), iterations:250000, hash:"SHA-256"},
      km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(P.nonce)}, key, b64(P.ct));
    document.getElementById("content").innerHTML = new TextDecoder().decode(pt);
    document.getElementById("gate").style.display = "none";
    sessionStorage.setItem("trg-pw", pw);
  } catch(e) {
    document.getElementById("err").style.display = "block";
  }
}
document.getElementById("go").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") unlock(); });
const saved = sessionStorage.getItem("trg-pw");
if (saved) { document.getElementById("pw").value = saved; unlock(); }
