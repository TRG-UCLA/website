name: Update bibliography
on:
  schedule:
    - cron: "17 6 1 * *"      # 06:17 UTC on the 1st of each month
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/build_bibliography.py
      - name: Commit if changed
        run: |
          git config user.name "trg-bibliography-bot"
          git config user.email "actions@github.com"
          git add citations/
          git diff --cached --quiet || git commit -m "Monthly bibliography update"
          git push
